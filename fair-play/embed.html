<!-- Cole este trecho no código-fonte da sua página, onde o painel deve aparecer.
     Para abrir em outra aba, acrescente ao src: #problemas, #parfb ou #2028 -->
<iframe class="liga-fpf"
  src="https://igorsiqueirahub.github.io/liga-cbf/fair-play/"
  title="Fair Play Financeiro: o balanço de 2026 e o que vem por aí"
  allow="clipboard-write" style="width:100%;height:1800px;border:0;display:block" loading="lazy"></iframe>
<script>
/* Ajusta a altura do iframe, volta ao topo do painel quando o leitor troca de aba
   e faz o botão "Copiar link" copiar o endereço desta página */
(function () {
  if (window.__ligaFpf) return; window.__ligaFpf = true;
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d.type !== 'string' || d.type.indexOf('liga-fpf:') !== 0) return;
    document.querySelectorAll('iframe.liga-fpf').forEach(function (f) {
      if (f.contentWindow !== e.source) return;
      if (d.type === 'liga-fpf:pronto') f.contentWindow.postMessage({ type: 'liga-fpf:pagina', url: location.href }, '*');
      if (d.type === 'liga-fpf:altura') f.style.height = d.altura + 'px';
      if (d.type === 'liga-fpf:rolar') {
        var alvo = f.getBoundingClientRect().top + window.pageYOffset + d.y;
        if (window.pageYOffset > alvo) window.scrollTo({ top: alvo, behavior: 'smooth' });
      }
    });
  });
})();
</script>
