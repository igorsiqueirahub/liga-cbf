<!-- Cole este trecho no código-fonte da sua página, onde o painel deve aparecer.
     Para abrir em outra aba, acrescente ao src: #calendario, #atletas, #horarios ou #contexto -->
<iframe class="liga-cbf"
  src="https://igorsiqueirahub.github.io/liga-cbf/"
  title="Liga do Futebol do Brasil: o que os clubes aprovaram"
  allow="clipboard-write" style="width:100%;height:1600px;border:0;display:block" loading="lazy"></iframe>
<script>
/* Ajusta a altura do iframe, volta ao topo do painel quando o leitor troca de aba
   e faz o botão "Copiar link" copiar o endereço desta página */
(function () {
  if (window.__ligaCbf) return; window.__ligaCbf = true;
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || typeof d.type !== 'string' || d.type.indexOf('liga-cbf:') !== 0) return;
    document.querySelectorAll('iframe.liga-cbf').forEach(function (f) {
      if (f.contentWindow !== e.source) return;
      if (d.type === 'liga-cbf:pronto') f.contentWindow.postMessage({ type: 'liga-cbf:pagina', url: location.href }, '*');
      if (d.type === 'liga-cbf:altura') f.style.height = d.altura + 'px';
      if (d.type === 'liga-cbf:rolar') {
        var alvo = f.getBoundingClientRect().top + window.pageYOffset + d.y;
        if (window.pageYOffset > alvo) window.scrollTo({ top: alvo, behavior: 'smooth' });
      }
    });
  });
})();
</script>
